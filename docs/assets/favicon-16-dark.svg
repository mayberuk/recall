<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <title>recall</title>
  <!-- The Excluded Register: a ruled ledger cell, sprocket holes down the left
       rail, three rows found and one row broken. The break is geometry, not a
       hue, so the mark reads the same in colour, in one ink, and at 16px. -->
    <rect width="16.00" height="16.00" fill="#141a1d"/>
    <rect x="0.20" y="0.20" width="15.60" height="15.60" fill="none" stroke="#5b93c4" stroke-width="1.00"/>
    <line x1="3.60" y1="0" x2="3.60" y2="16.00" stroke="#5b93c4" stroke-width="1.00"/>
    <circle cx="1.80" cy="2.40" r="0.80" fill="#080c0d"/>
    <circle cx="1.80" cy="8.00" r="0.80" fill="#080c0d"/>
    <circle cx="1.80" cy="13.60" r="0.80" fill="#080c0d"/>
    <rect x="5.20" y="2.00" width="9.20" height="2.00" fill="#6ecfa0"/>
    <rect x="5.20" y="5.60" width="9.20" height="2.00" fill="#6ecfa0"/>
    <rect x="5.20" y="9.20" width="3.50" height="2.00" fill="#d9a441"/>
    <rect x="10.90" y="9.20" width="3.50" height="2.00" fill="#d9a441"/>
    <rect x="5.20" y="12.40" width="9.20" height="2.00" fill="#6ecfa0"/>
</svg>
